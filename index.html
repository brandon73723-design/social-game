<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>社會探險隊：翰林五上</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7E8; --panel:#FFFFFF; --ink:#2B2D42; --muted:#6B6F8A;
  --sea:#3BA7F0; --sea-deep:#FF7A59; --gold:#FFC93C; --ok:#22B573; --bad:#F25C54;
  --line:#FFD9B0; --chip:#F2F9FF; --okbg:#E2F8EC; --badbg:#FFE7E5;
  --asia:#7CC8D6; --europe:#F6D96B; --africa:#B79AE0; --america:#F5A98E; --oceania:#A6D97A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1F3E; --panel:#282C57; --ink:#F2F2FF; --muted:#AEB3D9;
    --sea:#3896DD; --sea-deep:#D9603F; --line:#40467D; --chip:#30366A;
    --okbg:#173B2C; --badbg:#46221C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1F3E; --panel:#282C57; --ink:#F2F2FF; --muted:#AEB3D9;
  --sea:#3896DD; --sea-deep:#D9603F; --line:#40467D; --chip:#30366A;
  --okbg:#173B2C; --badbg:#46221C; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-weight:500;line-height:1.6;font-size:18px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{background:var(--sea-deep);color:#fff;padding:28px 0 26px}
header h1{margin:0;font-size:44px;font-weight:900;letter-spacing:.06em;line-height:1.2}
header p{margin:6px 0 0;font-size:18px;opacity:.9}
main{padding:28px 0 48px}
.screen[hidden],[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{border:0;border-radius:14px;padding:12px 22px;min-height:50px;font-weight:700;background:var(--sea);color:#fff;font-size:18px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.warn{background:var(--bad)}
.missions{display:grid;gap:16px}
.mission{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:18px;text-align:left;
  background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px 22px}
.mission:hover{border-color:var(--sea)}
.mission:nth-child(5n+2) .num{background:#7ED6A5;color:#0E4A2C}
.mission:nth-child(5n+3) .num{background:#7CC4FA;color:#0B3A63}
.mission:nth-child(5n+4) .num{background:#FF9F8A;color:#5A1A0C}
.mission:nth-child(5n+5) .num{background:#C3A6F5;color:#35185F}
header{background:linear-gradient(120deg,#FF7A59 0%,#FF9E5E 55%,#FFC93C 100%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header{background:linear-gradient(120deg,#C9533A 0%,#D9763F 60%,#C99A2E 100%)}}
:root[data-theme="dark"] header{background:linear-gradient(120deg,#C9533A 0%,#D9763F 60%,#C99A2E 100%)}
header h1{text-shadow:0 2px 0 rgba(0,0,0,.12)}
.mission .num{width:56px;height:56px;border-radius:50%;background:var(--gold);color:#3A2600;display:grid;place-items:center;font-size:28px;font-weight:900}
.mission h2{margin:0;font-size:24px;font-weight:900}
.mission p{margin:2px 0 0;color:var(--muted);font-size:16px}
.stars{font-size:28px;letter-spacing:2px;color:var(--gold);white-space:nowrap}
.stars .off{color:var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.progress{color:var(--muted);font-weight:700}
.prompt{font-size:30px;font-weight:900;margin:0 0 14px;line-height:1.35}
.prompt b{color:var(--sea)}
.mapbox{overflow-x:auto;border-radius:18px;border:3px solid var(--sea-deep);background:var(--sea)}
.mapbox svg{display:block;width:100%;min-width:720px;height:auto}
.mapbox.tw svg{min-width:0;max-width:620px;margin:0 auto}
.swipe-hint{display:none;margin:-6px 0 10px}
@media (max-width:720px){.swipe-hint.show{display:block}}
.land{stroke:#ffffff;stroke-width:1.5;cursor:pointer}
.land:hover{filter:brightness(1.08)}
.isle-hit{fill:transparent;stroke:none}
.zone polygon{fill:transparent;cursor:pointer}
.zone:hover polygon{fill:rgba(255,255,255,.08)}
.hitline{stroke:transparent;stroke-width:16;cursor:pointer}
.visline{stroke:#fff;stroke-width:1.5;stroke-dasharray:6 6;opacity:.75;pointer-events:none}
.visline.eq{stroke:var(--gold);opacity:1}
.visline.found{stroke:var(--gold);stroke-width:3;stroke-dasharray:none;opacity:1}
.tw-shape{fill:#E0533F;stroke:#fff;stroke-width:1.5;pointer-events:none}
.maplabel{font-weight:900;font-size:17px;fill:#12304F;paint-order:stroke;stroke:#fff;stroke-width:4px;pointer-events:none}
.maplabel.sea{fill:#fff;stroke:#164C88}
.deg{fill:#fff;font-size:12px;font-weight:700;pointer-events:none;opacity:.85}
.coast-hit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;stroke-linecap:round}
#twmap:not(.coastmode) .coast-hit{pointer-events:none}
.coast-vis{fill:none;stroke:#164C88;stroke-width:3;stroke-dasharray:6 4;opacity:0;pointer-events:none}
.coast-dot{fill:#fff;stroke:#164C88;stroke-width:2;opacity:0;pointer-events:none}
#twmap.coastmode .coast-dot{opacity:1}
#twmap.coastmode .coast-vis{opacity:.9}
#twmap .coast-vis.found{stroke:var(--gold);stroke-width:5;stroke-dasharray:none;opacity:1}
#twmap .coast-vis.hint{stroke:var(--gold);stroke-width:5;opacity:1}
.hint{animation:pulse .8s ease-in-out infinite}
.zone.hint polygon{fill:rgba(242,181,68,.5)}
.visline.hint{stroke:var(--gold);stroke-width:5;opacity:1}
@keyframes pulse{50%{opacity:.35}}
.feedback{min-height:56px;margin-top:14px;padding:12px 16px;border-radius:14px;font-weight:700}
.feedback.ok{background:var(--okbg);color:var(--ok)}
.feedback.bad{background:var(--badbg);color:var(--bad)}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:26px}
.question{font-size:26px;font-weight:900;margin:0 0 18px;line-height:1.45}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--chip);border:2px solid var(--line);
  border-radius:14px;padding:12px 16px;min-height:60px;font-size:20px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt .k{flex:none;width:32px;height:32px;border-radius:8px;background:var(--sea);color:#fff;display:grid;place-items:center;font-size:16px}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ok .k{background:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt.bad .k{background:var(--bad)}
.opt:disabled{cursor:default}
.explain{margin-top:18px}
.actions{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap}
.keyhint{color:var(--muted);font-size:15px;margin-top:10px}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:14px 24px}
.match .col{display:grid;gap:12px;align-content:start}
.tile{background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:14px 16px;min-height:58px;font-size:19px;font-weight:700;text-align:left}
.tile:hover:not(:disabled){border-color:var(--sea)}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold) inset}
.tile.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.tile.bad{background:var(--badbg);border-color:var(--bad)}
.tile:disabled{cursor:default}
.sortItem{font-size:30px;font-weight:900;text-align:center;padding:26px 12px 30px;line-height:1.4}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.placed{margin:0 0 18px;padding-left:1.6em;font-size:20px;font-weight:700}
.placed li{background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.placed:empty{display:none}
.result{text-align:center}
.result .stars{font-size:64px}
.result h2{font-size:30px;margin:6px 0}
.review{text-align:left;margin-top:22px}
.review h3{margin:0 0 8px;font-size:20px}
.review li{margin-bottom:10px}
.review .ans{color:var(--ok);font-weight:700}
.unit{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:18px;display:grid;grid-template-columns:64px 1fr;gap:18px}
.unit .big{font-size:64px;font-weight:900;line-height:1}
.unit h2{margin:4px 0 12px;font-size:26px;font-weight:900}
.lessons{display:grid;gap:8px}
.lesson{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--chip);
  border:2px solid var(--line);border-radius:12px;padding:10px 14px;min-height:54px;font-size:18px;font-weight:700}
.lesson:hover:not(:disabled){border-color:var(--sea)}
.lesson:disabled{cursor:default;opacity:.6}
.lesson .meta{color:var(--muted);font-size:15px;white-space:nowrap}
.lesson .meta.go{color:var(--gold);font-size:18px}
.wbbar{margin-bottom:18px}
footer{color:var(--muted);font-size:14px;padding:0 0 30px}
@media (max-width:640px){
  .options{grid-template-columns:1fr} header h1{font-size:34px} .prompt{font-size:24px}
  .unit{grid-template-columns:1fr;gap:4px}.unit .big{font-size:44px}
  .match{grid-template-columns:1fr 1.3fr;gap:10px} .sortItem{font-size:24px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>社會探險隊</h1>
    <p>翰林版國小社會五上（第五冊）</p>
  </div>
</header>

  <section id="quiz" class="screen" hidden>
    <div class="bar">

      b.className = 'lesson';
      if(ls.id && LESSONS[ls.id]){
        const st = lessonStars(ls.id);
        b.innerHTML = `<span>${ls.t}</span><span class="meta go">★ ${st.got} / ${st.total}</span>`;
        b.onclick = () => { curLesson = ls.id; show('lesson'); };
      } else {
        b.innerHTML = `<span>${ls.t}</span><span class="meta">${ls.p ? '第 '+ls.p+' 頁　' : ''}準備中</span>`;
        b.disabled = true;
      }
      d.querySelector('.lessons').appendChild(b);
    });
    box.appendChild(d);
  });
}
function renderLesson(){
  const meta = LMETA[curLesson], s = readJSON(SKEY);
  $('lessonTitle').innerHTML = typeof meta.unit.n === 'number' ? `第${'一二三四五'[meta.unit.n-1]}單元　${meta.unit.t}<br>${meta.t}` : `${meta.unit.t}<br>${meta.t}`;
  $('missionList').innerHTML = '';
  LESSONS[curLesson].missions.forEach((m,i) => {
    const n = s[curLesson+':'+m.id] || 0;
    const b = document.createElement('button');
    b.className = 'mission';
    b.innerHTML = `<span class="num">${i+1}</span><span><h2>${m.title}</h2><p>${m.desc}</p></span><span class="stars" aria-label="${n} 顆星">${starHTML(n)}</span>`;
    b.onclick = () => startMission(m);
    $('missionList').appendChild(b);
  });
}
function startMission(m){
  curMission = m;
  if(m.type === 'map') startMap(m.map === 'TW' ? TW : m.map === 'TWC' ? TWC : WORLD);
  else if(m.type === 'quiz') startQuiz(m);
  else if(m.type === 'match') startMatch(m);
  else if(m.type === 'sort') startSort(m);
  else if(m.type === 'order') startOrder(m);
}
function finish(stars, title, text, reviewHTML){
  if(!curMission.wb && curLesson) saveStar(curLesson+':'+curMission.id, stars);
  $('resStars').innerHTML = starHTML(stars);
  $('resTitle').textContent = title;
  $('resText').textContent = text;
  $('resReview').innerHTML = reviewHTML || '';
  const m = curMission;
  $('resAgain').hidden = !!(m.wb && !Object.keys(readJSON(WKEY)).length);
  $('resAgain').onclick = () => startMission(m);
  show('result');
}

/* ================= 地圖引擎 ================= */
let mt = null;
function startMap(cfg){
  const svg = $(cfg.svg);
  mt = {cfg, svg, list:shuffle(cfg.tasks), i:0, score:0, tries:0, lock:false};
  svg.querySelector('.labels').innerHTML = '';
  svg.classList.toggle('coastmode', !!cfg.coast);
  svg.querySelectorAll('.hint, .found').forEach(e => e.classList.remove('hint','found'));
  $('box-world').hidden = cfg.svg !== 'world';
  $('box-twmap').hidden = cfg.svg !== 'twmap';
  $('swipeHint').classList.toggle('show', cfg.svg === 'world');
  show('mapScreen'); nextMapTask();
}
function nextMapTask(){
  mt.svg.querySelectorAll('.hint').forEach(e => e.classList.remove('hint'));
  if(mt.i >= mt.list.length){
    return finish(ratioStars(mt.score/mt.list.length), curMission.title + '完成！', `第一次就點對 ${mt.score} 題，共 ${mt.list.length} 題。`);
  }
  const t = mt.list[mt.i];
  mt.tries = 0; mt.lock = false;
  $('mapPrompt').innerHTML = `請在地圖上點出：<b>${mt.cfg.names[t.id]}</b>`;
  $('mapProgress').textContent = `第 ${mt.i+1} / ${mt.list.length} 題`;
  setFb('mapFeedback','','');
}
function addLabel(id){
  const c = mt.cfg, isSea = c.sea.includes(id), isLine = c.lines.includes(id);
  (c.labels[id]||[]).forEach(([x,y]) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x); t.setAttribute('y',y);
    t.setAttribute('text-anchor', isLine ? 'start' : 'middle');
    t.setAttribute('class','maplabel' + (isSea ? ' sea' : ''));
    t.textContent = c.names[id];
    mt.svg.querySelector('.labels').appendChild(t);
  });
  mt.svg.querySelectorAll(`[data-hint="${id}"]`).forEach(e => e.classList.add('found'));
}
function mapClick(e){
  if(screen !== 'mapScreen' || !mt || mt.lock || e.currentTarget !== mt.svg) return;
  const t = mt.list[mt.i];
  const el = e.target.closest('[data-id]');
  if(!el){ setFb('mapFeedback', mt.cfg.miss, 'bad'); return; }
  const id = el.dataset.id;
  if(id === t.id){
    if(mt.tries === 0) mt.score++;
    addLabel(id); mt.lock = true;
    setFb('mapFeedback', '答對了！' + t.tip, 'ok');
    setTimeout(() => { mt.i++; nextMapTask(); }, 1800);
  } else {
    mt.tries++;
    if(mt.tries === 1){
      const name = mt.cfg.names[t.id];
      const qtext = t.tip.includes(name) ? `地圖題：「${t.tip.split(name).join('（　）')}」括號裡應該填什麼？` : `地圖題：「${t.tip}」這是在說哪裡？`;
      addWrong({q:qtext, o:[name, ...others(mt.cfg.tasks.map(x => mt.cfg.names[x.id]), name, 3)], e:`答案是「${name}」，記得它在地圖上的位置喔！`});
    }
    let msg = `這裡是「${mt.cfg.names[id]}」，不是「${mt.cfg.names[t.id]}」。`;
    if(mt.tries >= 2){
      msg += '看看閃爍的地方。';
      mt.svg.querySelectorAll(`[data-id="${t.id}"], [data-hint="${t.id}"]`).forEach(x => x.classList.add('hint'));
    }
    setFb('mapFeedback', msg, 'bad');
  }
}
$('world').addEventListener('click', mapClick);
$('twmap').addEventListener('click', mapClick);

/* ================= 問答引擎 ================= */
let qz = null;
function startQuiz(m){
  let qs;
  if(m.wb) qs = Object.values(readJSON(WKEY));
  else if(m.from) qs = shuffle(m.from.flatMap(lid => LESSONS[lid].missions.filter(x => x.type === 'quiz').flatMap(x => x.qs))).slice(0, m.count);
  else qs = m.qs;
  if(!qs.length) return finish(3, '錯題本清空了！', '目前沒有錯題，繼續保持。');
  qz = {list:shuffle(qs).map(q => ({...q, order:shuffle(q.o.map((_,i) => i))})), i:0, score:0, wrong:[], answered:false, wb:!!m.wb};
  show('quiz'); renderQ();
}
function renderQ(){
  if(qz.i >= qz.list.length){
    let rev = '';
    if(qz.wrong.length) rev = '<h3>錯題回顧</h3><ul>' + qz.wrong.map(q => `<li>${q.q}<br><span class="ans">答案：${q.o[0]}</span>。${q.e}</li>`).join('') + '</ul>';
    const left = Object.keys(readJSON(WKEY)).length;
    const text = `答對 ${qz.score} 題，共 ${qz.list.length} 題。` + (qz.wb ? (left ? `錯題本還剩 ${left} 題。` : '錯題本已經清空了！') : '');
    return finish(ratioStars(qz.score/qz.list.length), curMission.title + '完成！', text, rev);
  }
  const q = qz.list[qz.i];
  qz.answered = false;
  $('quizProgress').textContent = `第 ${qz.i+1} / ${qz.list.length} 題`;
  $('quizQ').textContent = q.q;
  $('quizOpts').innerHTML = '';
  q.order.forEach((oi, k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="k">${k+1}</span><span>${q.o[oi]}</span>`;
    b.onclick = () => answer(k);
    $('quizOpts').appendChild(b);
  });
  setFb('quizExp','','');
  $('quizNext').hidden = true;
}
function answer(k){
  if(qz.answered) return;
  qz.answered = true;
  const q = qz.list[qz.i], btns = $('quizOpts').children, right = q.order.indexOf(0);
  [...btns].forEach(b => b.disabled = true);
  btns[right].classList.add('ok');
  const w = readJSON(WKEY);
  if(k === right){
    qz.score++; setFb('quizExp','答對了！' + q.e, 'ok');
    if(qz.wb){ delete w[q.q]; writeJSON(WKEY, w); }
  } else {
    btns[k].classList.add('bad'); qz.wrong.push(q);
    setFb('quizExp', '答錯了。正確答案是「' + q.o[0] + '」。' + q.e, 'bad');
    addWrong(q);
  }
  $('quizNext').hidden = false; $('quizNext').focus();
}
$('quizNext').onclick = () => { qz.i++; renderQ(); };

/* ================= 配對引擎 ================= */
let mm = null;
function startMatch(m){
  mm = {m, sel:null, done:0, miss:0};
  $('matchLeft').innerHTML = ''; $('matchRight').innerHTML = '';
  shuffle(m.pairs.map((p,i) => i)).forEach(i => {
    const b = document.createElement('button');
    b.className = 'tile'; b.textContent = m.pairs[i][0]; b.dataset.k = i;
    b.onclick = () => { document.querySelectorAll('#matchLeft .tile').forEach(t => t.classList.remove('sel')); b.classList.add('sel'); mm.sel = b; setFb('matchFeedback','',''); };
    $('matchLeft').appendChild(b);
  });
  shuffle(m.pairs.map((p,i) => i)).forEach(i => {
    const b = document.createElement('button');
    b.className = 'tile'; b.textContent = m.pairs[i][1]; b.dataset.k = i;
    b.onclick = () => pickRight(b);
    $('matchRight').appendChild(b);
  });
  $('matchProgress').textContent = `已配對 0 / ${m.pairs.length}`;
  setFb('matchFeedback','','');
  show('match');
}
function pickRight(b){
  if(!mm.sel){ setFb('matchFeedback','先點左邊的項目。','bad'); return; }
  const total = mm.m.pairs.length;
  if(mm.sel.dataset.k === b.dataset.k){
    [mm.sel, b].forEach(t => { t.classList.remove('sel'); t.classList.add('ok'); t.disabled = true; });
    mm.sel = null; mm.done++;
    $('matchProgress').textContent = `已配對 ${mm.done} / ${total}`;
    setFb('matchFeedback','配對成功！','ok');
    if(mm.done === total){
      const s = mm.miss <= 1 ? 3 : mm.miss <= 3 ? 2 : 1;
      setTimeout(() => finish(s, curMission.title + '完成！', `全部配對成功，配錯 ${mm.miss} 次。`), 700);
    }
  } else {
    mm.miss++;
    const pair = mm.m.pairs[+mm.sel.dataset.k];
    addWrong({q:`「${pair[0]}」的正確說明是哪一個？`, o:[pair[1], ...others(mm.m.pairs.map(x => x[1]), pair[1], 3)], e:`「${pair[0]}」：${pair[1]}。`});
    b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 600);
    setFb('matchFeedback', `「${mm.sel.textContent}」不是這個意思，再試試看。`, 'bad');
  }
}

/* ================= 分類引擎 ================= */
let st = null;
function startSort(m){
  st = {m, list:shuffle(m.items), i:0, first:0, tried:false, lock:false};
  $('sortPrompt').textContent = m.prompt;
  $('sortCats').innerHTML = '';
  m.cats.forEach((c,k) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="k">${k+1}</span><span>${c}</span>`;
    b.onclick = () => pickCat(k);
    $('sortCats').appendChild(b);
  });
  show('sort'); nextSort();
}
function nextSort(){
  if(st.i >= st.list.length){
    return finish(ratioStars(st.first/st.list.length), curMission.title + '完成！', `第一次就分對 ${st.first} 個，共 ${st.list.length} 個。`);
  }
  st.tried = false; st.lock = false;
  $('sortItem').textContent = st.list[st.i].t;
  $('sortProgress').textContent = `第 ${st.i+1} / ${st.list.length} 個`;
  [...$('sortCats').children].forEach(b => b.classList.remove('ok','bad'));
  setFb('sortFb','','');
}
function pickCat(k){
  if(st.lock) return;
  const it = st.list[st.i], btn = $('sortCats').children[k];
  if(k === it.c){
    if(!st.tried) st.first++;
    st.lock = true; btn.classList.add('ok');
    setFb('sortFb', `答對了！這是「${st.m.cats[it.c]}」。`, 'ok');
    setTimeout(() => { st.i++; nextSort(); }, 1100);
  } else {
    if(!st.tried){
      const cat = st.m.cats[it.c];
      addWrong({q:`${st.m.prompt}「${it.t}」`, o:[cat, ...others(st.m.cats, cat, 3)], e:`答案是「${cat}」。`});
    }
    st.tried = true; btn.classList.add('bad');
    setFb('sortFb', `不是「${st.m.cats[k]}」，再想想看。`, 'bad');
  }
}

/* ================= 排序引擎 ================= */
let od = null;
function startOrder(m){
  od = {m, next:0, miss:0};
  $('orderPrompt').textContent = m.prompt;
  $('orderPlaced').innerHTML = ''; $('orderPool').innerHTML = '';
  shuffle(m.items.map((t,i) => i)).forEach(i => {
    const b = document.createElement('button');
    b.className = 'opt'; b.innerHTML = `<span>${m.items[i]}</span>`;
    b.onclick = () => pickOrder(b, i);
    $('orderPool').appendChild(b);
  });
  $('orderProgress').textContent = `已排好 0 / ${m.items.length}`;
  setFb('orderFb','','');
  show('order');
}
function pickOrder(b, i){
  const total = od.m.items.length;
  if(i === od.next){
    b.remove();
    const li = document.createElement('li'); li.textContent = od.m.items[i];
    $('orderPlaced').appendChild(li);
    od.next++;
    $('orderProgress').textContent = `已排好 ${od.next} / ${total}`;
    setFb('orderFb','排對了！','ok');
    if(od.next === total){
      const s = od.miss === 0 ? 3 : od.miss <= 2 ? 2 : 1;
      setTimeout(() => finish(s, curMission.title + '完成！', `全部排好了，排錯 ${od.miss} 次。`, od.m.years ? '<h3>正確順序</h3><ol>' + od.m.items.map((t,i) => `<li>${od.m.years[i]}：${t}</li>`).join('') + '</ol>' : ''), 700);
    }
  } else {
    od.miss++;
    b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 600);
    setFb('orderFb','還有更早發生的事，再想想看。','bad');
  }
}

/* ================= 鍵盤 ================= */
document.addEventListener('keydown', e => {
  if(screen === 'quiz' && qz){
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= qz.list[qz.i].o.length && !qz.answered) answer(n-1);
    else if(e.key === 'Enter' && qz.answered){ e.preventDefault(); qz.i++; renderQ(); }
  } else if(screen === 'sort' && st){
    const n = parseInt(e.key, 10);
    if(n >= 1 && n <= st.m.cats.length) pickCat(n-1);
  }
});

show('units');
</script>
